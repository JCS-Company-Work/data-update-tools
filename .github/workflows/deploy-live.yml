name: Deploy to Live

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch, tag or commit to deploy to production"
                required: true
                default: "main"

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
                  SSH_HOST: ${{ vars.SSH_HOST }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/data_update_tools_deploy
                  chmod 600 ~/.ssh/data_update_tools_deploy
                  ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

                  eval "$(ssh-agent -s)"
                  echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
                  echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

                  cat > "$RUNNER_TEMP/ssh-askpass" <<'EOF'
                  #!/bin/sh
                  printf '%s\n' "$DEPLOY_SSH_PASSPHRASE"
                  EOF
                  chmod 700 "$RUNNER_TEMP/ssh-askpass"
                  DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" SSH_ASKPASS_REQUIRE=force \
                    ssh-add ~/.ssh/data_update_tools_deploy </dev/null

            - name: Deploy to Live
              env:
                  SSH_HOST: ${{ vars.SSH_HOST }}
                  PT_SSH_USER: ${{ vars.PT_SSH_USER }}
                  LIVE_DEPLOY_PATH: ${{ vars.LIVE_DEPLOY_PATH }}
              run: |
                  destination="${LIVE_DEPLOY_PATH%/}"
                  if [[ "$destination" != /*/data-update-tools ]]; then
                    echo "LIVE_DEPLOY_PATH must be an absolute path ending in /data-update-tools." >&2
                    exit 1
                  fi

                  rsync -azc --delete \
                    --omit-dir-times \
                    --no-times \
                    --no-perms \
                    --no-owner \
                    --no-group \
                    --exclude=".git" \
                    --exclude=".github" \
                    --exclude=".env" \
                    --exclude=".DS_Store" \
                    --exclude="tests/" \
                    --exclude=".gitignore" \
                    --exclude="readme.md" \
                    --exclude=".phpunit.result.cache" \
                    -e "ssh" \
                    ./ \
                    "$PT_SSH_USER@$SSH_HOST:$destination/"

            - name: Complete
              run: echo "Live deployment complete."
